<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Taemin Yun | Portfolio</title>
  <meta name="description" content="소프트웨어 엔지니어 윤태민의 포트폴리오">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <nav class="nav container">
      <a href="#top" class="logo">윤태민</a>
      <ul class="nav-links">
        <li><a href="#projects">Projects</a></li>
        <li><a href="#contact">Contact</a></li>
      </ul>
      <div class="dropdown lang-menu">
        <button class="dropdown-toggle lang-toggle" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="lang-list"></button>
        <ul class="dropdown-list" id="lang-list" hidden></ul>
      </div>
      <button class="nav-toggle" aria-label="메뉴 열기" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
    </nav>
  </header>

  <main id="top">
    <section id="projects" class="section container reveal">
      <p class="lead intro" id="intro"></p>
      <div class="section-head">
        <h2 class="section-title">Projects</h2>
        <div class="dropdown sort-menu">
          <button class="dropdown-toggle filter-chip" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="sort-list"></button>
          <ul class="dropdown-list" id="sort-list" hidden></ul>
        </div>
      </div>
      <div class="stack-filter" role="group" aria-label="기술로 필터"></div>
      <div class="project-list"></div>
    </section>

    <section id="contact" class="section container reveal">
      <h2 class="section-title">Contact</h2>
      <p class="lead" id="contact-message"></p>
      <div class="contact-links"></div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
