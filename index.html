<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Taemin Yun | Portfolio</title>
  <meta name="description" content="소프트웨어 엔지니어 윤태민의 포트폴리오">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <nav class="nav container">
      <a href="#top" class="logo">TY</a>
      <button class="nav-toggle" aria-label="메뉴 열기" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
      <ul class="nav-links">
        <li><a href="#projects">Projects</a></li>
        <li><a href="#contact">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main id="top">
    <section id="projects" class="section container reveal">
      <h2 class="section-title">Projects</h2>
      <div class="stack-filter" role="group" aria-label="기술로 필터"></div>
      <div class="project-list"></div>
    </section>

    <section id="contact" class="section container reveal">
      <h2 class="section-title">Contact</h2>
      <p class="lead" id="contact-message"></p>
      <div class="contact-links"></div>
    </section>
  </main>

  <footer class="site-footer">
    <p>© <span id="year"></span> Taemin Yun. Built with HTML, CSS &amp; JS.</p>
  </footer>

  <script src="script.js"></script>

</html>
